<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DIVED">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>ACTIVE — DIVED</title>
<script src="menu.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdfdfd; --white:#ffffff; --black:#000000; --lime:#ceff00;
    --g1:#eeeeee; --g2:#cccccc; --g3:#aaaaaa; --shadow:rgba(0,0,0,.1);
    --tabh:64px; --appw:480px;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  ::selection{background:var(--lime); color:var(--black);}
  html,body{height:100%;}
  body{background:var(--g1); color:var(--black); font-family:'Noto Sans JP',sans-serif; -webkit-font-smoothing:antialiased;}
  button,input,textarea,select{font-family:inherit; color:var(--black);}
  .app{max-width:var(--appw); margin:0 auto; min-height:100%; background:var(--bg); position:relative; box-shadow:0 0 40px var(--shadow);
    padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 40px);}
  .appbar{position:sticky; top:0; z-index:20; background:var(--white); border-bottom:1px solid var(--g1);
    padding:calc(env(safe-area-inset-top) + 12px) 20px 12px; display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .appbar h1{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-style:italic; text-transform:uppercase; font-size:34px; line-height:.95;}
  .appbar h1::after{content:''; display:block; width:30px; height:4px; background:var(--lime); margin-top:6px; transform:skewX(-20deg);}
  .bar-r{display:flex; align-items:center; gap:12px;}
  .appbar .sub{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; text-align:right; line-height:1.5;}
  .appbar .sub b{display:inline-block; background:var(--lime); padding:1px 6px; font-weight:700;}

  .view{display:none; padding:20px 20px 0; animation:in .5s ease;}
  .view.active{display:block;}
  @keyframes in{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}

  /* 下タブ（workout / run と同じデザイン） */
  .tabbar{position:fixed; left:50%; transform:translateX(-50%); bottom:0; z-index:30; width:100%; max-width:var(--appw); background:var(--white);
    border-top:1px solid var(--g1); display:grid; grid-template-columns:repeat(4,1fr); padding-bottom:env(safe-area-inset-bottom); box-shadow:0 -4px 16px var(--shadow);}
  .tab{position:relative; height:var(--tabh); background:none; border:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    color:var(--g3); font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:.1em; font-size:12px; text-transform:uppercase;}
  .tab svg{width:22px; height:22px;}
  .tab::before{content:''; position:absolute; top:-1px; left:20%; right:20%; height:3px; background:var(--lime); transform:scaleX(0); transition:transform .5s;}
  .tab.active{color:var(--black);}
  .tab.active::before{transform:scaleX(1);}

  .label{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase;}
  .dim{color:var(--g3);}
  .section-t{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-style:italic; text-transform:uppercase; font-size:24px; margin:26px 0 12px; display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .section-t small{font-family:'JetBrains Mono',monospace; font-style:normal; font-weight:500; font-size:11px; letter-spacing:.1em;}
  .empty{padding:26px 0; text-align:center; color:var(--g3); font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.14em;}
  .btn{height:50px; border:2px solid var(--black); background:var(--white); cursor:pointer; padding:0 16px;
    font-family:'Barlow Condensed','Noto Sans JP',sans-serif; font-weight:800; font-size:18px; letter-spacing:.12em; text-transform:uppercase;}
  .btn.lime{background:var(--lime); border-color:var(--lime);}
  .btn.dark{background:var(--black); color:var(--white);}
  .btn.ghost{border-color:var(--g2); color:#777; font-size:15px;}
  .btn.sm{height:38px; font-size:14px; padding:0 12px;}
  .btn.block{display:block; width:100%;}
  .btn:focus-visible{outline:none; box-shadow:0 0 0 3px var(--lime);}
  .btn:active{transform:translateY(1px);}
  .card{background:var(--white); border:1px solid var(--g1); padding:16px;}
  .in{width:100%; height:46px; border:1px solid var(--g2); background:var(--bg); padding:0 12px; font-size:16px; border-radius:0;}
  textarea.in{height:70px; padding:10px 12px; resize:vertical;}
  .in:focus{outline:none; border-color:var(--black); box-shadow:inset 0 0 0 1px var(--black);}
  .field{display:block; margin-top:14px;}
  .field > .label{display:block; margin-bottom:8px;}
  .note{font-size:12px; color:#777; margin-top:8px; line-height:1.6;}

  /* ---------- 週のリング ---------- */
  .week{background:var(--black); color:var(--white); padding:18px 20px; display:grid; grid-template-columns:auto 1fr; gap:18px; align-items:center; position:relative; overflow:hidden;}
  .week::after{content:''; position:absolute; right:-30px; top:0; bottom:0; width:90px; background:var(--lime); transform:skewX(-20deg); opacity:.08;}
  .ring{width:128px; height:128px; position:relative;}
  .ring svg{width:100%; height:100%; transform:rotate(-90deg);}
  .ring .v{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .ring .v b{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-style:italic; font-size:44px; line-height:.9; color:var(--lime);}
  .ring .v small{font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--g3); margin-top:2px;}
  .ring circle.p{transition:stroke-dashoffset 1s ease;}
  .week .info{min-width:0; position:relative; z-index:1;}
  .week .info .big{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:24px; line-height:1.1; margin-top:4px;}
  .week .info .label{color:var(--g3);}
  .days{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:12px; align-items:end; height:58px;}
  .days div{display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:3px; font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--g3);}
  .days i{display:block; width:100%; background:#333; min-height:3px;}
  .days i.on{background:var(--lime);}
  .days div.today span{color:var(--lime);}

  /* ---------- かんたん記録 ---------- */
  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{height:40px; padding:0 14px; border:1px solid var(--g2); background:var(--white); cursor:pointer; font-size:14px; font-weight:700; display:inline-flex; align-items:center; gap:6px;}
  .chip.on{background:var(--black); color:var(--white); border-color:var(--black);}
  .chip.add{border-style:dashed; color:#777;}
  .chip:focus-visible{outline:none; box-shadow:0 0 0 3px var(--lime);}
  .seg{display:grid; gap:6px;}
  .seg button{height:44px; border:1px solid var(--g2); background:var(--white); cursor:pointer; font-family:'Barlow Condensed','Noto Sans JP',sans-serif; font-weight:800; font-size:17px;}
  .seg button.on{background:var(--lime); border-color:var(--black); box-shadow:inset 0 0 0 1px var(--black);}
  .seg button:focus-visible{outline:none; box-shadow:0 0 0 3px var(--lime);}
  .mood button{font-size:22px; font-family:inherit;}
  .minrow{display:grid; grid-template-columns:repeat(5,1fr) 1.2fr; gap:6px;}
  .minrow .in{height:44px; text-align:center; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:18px; padding:0 4px;}

  .ent{display:grid; grid-template-columns:auto 1fr auto auto; gap:12px; align-items:center; padding:12px 2px; border-bottom:1px solid var(--g1);}
  .ent .k{width:8px; height:30px; transform:skewX(-20deg); background:var(--lime);}
  .ent .m{min-width:0; font-size:14px; font-weight:700;}
  .ent .m small{display:block; font-weight:400; font-size:12px; color:#777; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ent .v{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:24px; white-space:nowrap;}
  .ent .v small{font-size:13px; margin-left:2px;}
  .ent .x{width:34px; height:34px; border:1px solid var(--g2); background:none; cursor:pointer; color:#777; font-size:14px;}
  .ent .x.arm{background:var(--black); color:var(--lime); border-color:var(--black);}

  /* ---------- FLOW ---------- */
  .flow{background:var(--white); border:1px solid var(--g1); border-left:6px solid var(--black); margin-bottom:10px; display:grid; grid-template-columns:1fr auto; align-items:center;}
  .flow .bd{padding:14px 14px 12px; min-width:0;}
  .flow h3{font-size:16px; font-weight:700;}
  .flow .meta{font-family:'JetBrains Mono',monospace; font-size:11px; color:#777; margin-top:4px;}
  .flow .poses{font-size:12px; color:#555; margin-top:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .flow .act{display:flex; flex-direction:column; gap:6px; padding:10px;}
  .flow .play{width:56px; height:56px; background:var(--lime); border:2px solid var(--black); cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .flow .play svg{width:22px; height:22px;}
  .flow .ed{height:28px; background:none; border:1px solid var(--g2); font-size:11px; cursor:pointer; color:#555;}
  .opts{display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:12px; font-size:13px;}
  .opts label{display:flex; align-items:center; gap:8px;}
  .opts input{width:20px; height:20px; accent-color:var(--black);}

  .editor .pr{display:grid; grid-template-columns:1fr 78px auto auto auto; gap:6px; align-items:center; margin-top:6px;}
  .editor .pr .in{height:42px;}
  .editor .pr .sec{text-align:center; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:18px; padding:0 4px;}
  .editor .pr button{width:34px; height:42px; border:1px solid var(--g2); background:var(--white); cursor:pointer; font-size:14px;}
  .editor .tot{font-family:'JetBrains Mono',monospace; font-size:12px; margin-top:10px; text-align:right;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px;}

  /* ---------- フロー再生（全画面） ---------- */
  .player{position:fixed; inset:0; z-index:100; background:var(--black); color:var(--white); display:flex; flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 18px) calc(env(safe-area-inset-left) + 20px);}
  .pl-top{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .pl-top .label{color:var(--g3);}
  .pl-x{height:40px; padding:0 14px; background:none; border:1px solid #444; color:var(--white); cursor:pointer; font-weight:700;}
  .pl-prog{display:flex; gap:3px; margin-top:12px;}
  .pl-prog i{flex:1; height:4px; background:#333;}
  .pl-prog i.done{background:var(--lime);}
  .pl-prog i.cur{background:linear-gradient(90deg, var(--lime) var(--p,0%), #333 var(--p,0%));}
  .pl-main{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px; min-height:0;}
  .pl-step{font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.14em; color:var(--g3);}
  .pl-name{font-size:clamp(28px, 8vw, 54px); font-weight:700; line-height:1.25; max-width:16em;}
  .pl-ring{width:min(56vw, 34vh); aspect-ratio:1; position:relative; margin-top:8px;}
  .pl-ring svg{width:100%; height:100%; transform:rotate(-90deg);}
  .pl-ring .t{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-style:italic; font-size:min(20vw, 13vh); color:var(--lime); font-variant-numeric:tabular-nums;}
  .pl-next{font-size:14px; color:var(--g3);}
  .pl-next b{color:var(--white); margin-left:6px;}
  .pl-ctrl{display:grid; grid-template-columns:1fr 1.6fr 1fr; gap:8px;}
  .pl-ctrl button{height:60px; background:var(--black); color:var(--white); border:1px solid #555; font-family:'Barlow Condensed','Noto Sans JP',sans-serif; font-weight:800; font-size:20px; letter-spacing:.08em; cursor:pointer;}
  .pl-ctrl button.main{background:var(--lime); color:var(--black); border-color:var(--lime);}
  .pl-ctrl button:focus-visible{outline:none; box-shadow:0 0 0 3px var(--lime);}
  .player.paused .pl-ring .t{animation:blink 1.2s steps(2) infinite;}
  @keyframes blink{50%{opacity:.35}}
  .pl-done{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center;}
  .pl-done h2{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-style:italic; font-size:64px; line-height:.9; color:var(--lime);}
  .pl-done .sum{font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--g3);}
  .pl-done .seg{width:min(100%, 420px);}
  .pl-done .seg button{background:var(--black); color:var(--white); border-color:#555;}
  .pl-done .seg button.on{background:var(--lime); color:var(--black);}
  .pl-done .btn{width:min(100%, 420px);}
  @media (orientation:landscape) and (max-height:520px){
    .pl-main{flex-direction:row; gap:28px;}
    .pl-main .txt{text-align:left;}
    .pl-ring{width:min(30vw, 52vh);}
    .pl-ctrl button{height:48px;}
  }

  /* ---------- BREATH ---------- */
  .br{background:var(--black); color:var(--white); padding:18px 16px 20px; text-align:center; position:relative; overflow:hidden;}
  .br-stage{height:280px; display:flex; align-items:center; justify-content:center; position:relative;}
  .br-guide{position:absolute; width:240px; height:240px; border-radius:50%; border:1px dashed #444;}
  .br-c{width:240px; height:240px; border-radius:50%; background:radial-gradient(circle at 50% 45%, var(--lime), #9fc400 70%); transform:scale(.42);
    display:flex; align-items:center; justify-content:center; box-shadow:0 0 60px rgba(206,255,0,.25);}
  .br-txt{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none;}
  .br-txt b{font-size:26px; font-weight:700; color:var(--white); text-shadow:0 1px 8px rgba(0,0,0,.6);}
  .br-txt span{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-style:italic; font-size:44px; line-height:1; color:var(--white); text-shadow:0 1px 8px rgba(0,0,0,.6);}
  .br-left{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--g3); margin-top:6px;}
  .pat{display:grid; grid-template-columns:repeat(3,1fr); gap:6px;}
  .pat button{border:1px solid var(--g2); background:var(--white); cursor:pointer; padding:10px 6px; text-align:center;}
  .pat button b{display:block; font-family:'Barlow Condensed','Noto Sans JP',sans-serif; font-weight:800; font-size:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .pat button small{display:block; font-size:11px; color:#555; margin-top:2px;}
  .pat button.on{background:var(--lime); border-color:var(--black); box-shadow:inset 0 0 0 1px var(--black);}
  .pat button:focus-visible{outline:none; box-shadow:0 0 0 3px var(--lime);}

  /* ---------- LOG ---------- */
  .chart{background:var(--black); color:var(--white); padding:16px 14px 10px;}
  .chart svg{display:block; width:100%; height:auto; overflow:visible;}
  .chart .ax{font-family:'JetBrains Mono',monospace; font-size:10px; fill:var(--g3);}
  .chart .vl{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:13px; fill:var(--white);}
  .brk{border-top:2px solid var(--black);}
  .brk div{display:grid; grid-template-columns:7em 1fr auto; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--g1); font-size:13px;}
  .brk i{display:block; height:10px; background:var(--black);}
  .brk b{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:18px; white-space:nowrap;}
  .day-h{font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; margin:18px 0 2px; display:flex; justify-content:space-between;}
  .day-h small{font-weight:500; color:#777;}
  .goalrow{display:flex; gap:8px; align-items:center;}
  .goalrow .in{max-width:130px; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:24px;}

  .toast{position:fixed; left:50%; bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 16px); transform:translate(-50%, 20px); background:var(--black); color:var(--lime);
    padding:12px 18px; font-family:'JetBrains Mono',monospace; font-size:13px; z-index:150; opacity:0; transition:all .3s; pointer-events:none; white-space:nowrap;}
  .toast.on{opacity:1; transform:translate(-50%, 0);}

  @media (min-width:768px){
    :root{--appw:100%;}
    .app{box-shadow:none;}
    .view{padding-top:24px; padding-left:max(28px, env(safe-area-inset-left)); padding-right:max(28px, env(safe-area-inset-right));}
    .appbar{padding-left:max(28px, env(safe-area-inset-left)); padding-right:max(28px, env(safe-area-inset-right));}
    .cols{display:grid; grid-template-columns:minmax(340px, 2fr) 3fr; gap:28px; align-items:start;}
    .col{min-width:0;}
    .col-r > .section-t:first-child{margin-top:0;}
    .tab{flex-direction:row; gap:8px; font-size:14px;}
    #flowList{display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:10px;}
    #flowList .flow{margin-bottom:0;}
  }
  @media (orientation:landscape) and (max-height:520px){
    :root{--tabh:46px;}
    .appbar{position:static; padding-top:calc(env(safe-area-inset-top) + 8px); padding-bottom:8px;}
    .appbar h1{font-size:24px;}
    .appbar h1::after{display:none;}
    .view{padding-top:14px;}
    .tab{flex-direction:row; gap:8px; font-size:13px;}
    .tab svg{width:18px; height:18px;}
    .br-stage{height:220px;}
  }
  @media (prefers-reduced-motion: reduce){ .view{animation:none;} .player.paused .pl-ring .t{animation:none;} }
</style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <h1 id="viewTitle">Active</h1>
    <div class="bar-r">
      <div class="sub" id="barSub">—</div>
      <div data-menu-slot></div>
    </div>
  </header>

  <!-- TODAY: 週のリング + かんたん記録 -->
  <main class="view active" id="v-today">
    <div class="cols"><div class="col col-l">
      <div class="week">
        <div class="ring">
          <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#333" stroke-width="12"/><circle class="p" id="ringP" cx="60" cy="60" r="52" fill="none" stroke="#ceff00" stroke-width="12" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg>
          <div class="v"><b id="wkMin">0</b><small>MIN</small></div>
        </div>
        <div class="info">
          <div class="label">THIS WEEK</div>
          <div class="big" id="wkMsg"></div>
          <div class="days" id="wkDays"></div>
        </div>
      </div>

      <div class="section-t"><span>Today</span><small id="todaySum"></small></div>
      <div id="todayList"></div>
    </div><div class="col col-r">
      <div class="section-t"><span>Quick log</span><small data-i18n="quickNote"></small></div>
      <div class="card">
        <div class="field" style="margin-top:0;"><span class="label">ACTIVITY</span><div class="chips" id="typeChips"></div></div>
        <div class="field" id="customRow" hidden><span class="label" data-i18n="newType"></span>
          <div style="display:flex; gap:6px;"><input class="in" id="customIn" maxlength="20"><button class="btn dark sm" id="customAdd" data-i18n="add"></button></div>
        </div>
        <div class="field"><span class="label">TIME (min)</span>
          <div class="minrow" id="minRow"></div>
        </div>
        <div class="field"><span class="label" data-i18n="intensity"></span><div class="seg" id="intSeg" style="grid-template-columns:repeat(3,1fr);"></div></div>
        <div class="field"><span class="label" data-i18n="moodQ"></span><div class="seg mood" id="moodSeg" style="grid-template-columns:repeat(5,1fr);"></div></div>
        <label class="field"><span class="label" data-i18n="memo"></span><textarea class="in" id="qMemo" data-i18n-ph="memoPh"></textarea></label>
        <button class="btn lime block" id="qSave" style="margin-top:16px; height:56px; font-size:20px;" data-i18n="logIt"></button>
      </div>
    </div></div>
  </main>

  <!-- FLOW: ガイド付きセッション -->
  <main class="view" id="v-flow">
    <div id="flowHome">
      <div class="section-t" style="margin-top:0;"><span>Flows</span><small data-i18n="flowNote"></small></div>
      <div id="flowList"></div>
      <button class="btn block" id="flowNew" style="margin-top:12px;" data-i18n="newFlow"></button>
      <div class="opts">
        <label><input type="checkbox" id="optVoice"><span data-i18n="voice"></span></label>

    const left = br.end - now;
    if(left <= 0){ brStop(true); return; }
    if(now >= br.phEnd){ br.pi = (br.pi + 1) % PATS[db.settings.br_pat].ph.length; brPhase(); }
    $('brCount').textContent = Math.max(1, Math.ceil((br.phEnd - now) / 1000));
    $('brLeft').textContent = t('brLeft', {t:mmss(left / 1000)});
  }
  function brStart(){
    br = {start:Date.now(), end:Date.now() + db.settings.br_min * 60000, pi:0};
    brPhase(); wake(true);
    clearInterval(brTimer); brTimer = setInterval(brTick, 200); brTick();
    renderBreath();
  }
  function brStop(complete){
    if(!br) return;
    const secs = (Date.now() - br.start) / 1000;
    clearInterval(brTimer); br = null; wake(false);
    const c = $('brC'); c.style.transition = 'transform 1.2s ease'; c.style.transform = 'scale(.42)';
    if(secs >= 60){
      const m = Math.round(secs / 60);
      addLog({type:'meditation', min:m, intensity:1, source:'breath', memo:t(PATS[db.settings.br_pat].name)});
      toast(t('brLogged', {m}));
      if(complete){ beep(784, .2); setTimeout(() => beep(1046, .4), 220); }
    }
    renderBreath();
  }
  $('brGo').onclick = () => br ? brStop(false) : brStart();
  function renderBreath(){
    $('brGo').textContent = br ? t('brStop') : t('brStart');
    $('brGo').className = 'btn block ' + (br ? 'dark' : 'lime');
    const sel = $('patSel'); sel.innerHTML = '';
    Object.keys(PATS).forEach(k => {
      const p = PATS[k], b = document.createElement('button');
      b.className = db.settings.br_pat === k ? 'on' : ''; b.disabled = !!br;
      b.innerHTML = `<b>${t(p.name)}</b><small>${p.ph.map(x => x[1]).join('-')}</small><small>${t(p.sub)}</small>`;
      b.onclick = () => { db.settings.br_pat = k; save(); renderBreath(); };
      sel.append(b);
    });
    const ms = $('brMin'); ms.innerHTML = '';
    [1, 3, 5, 10].forEach(m => { const b = document.createElement('button'); b.textContent = m + ' min'; b.className = db.settings.br_min === m ? 'on' : ''; b.disabled = !!br; b.onclick = () => { db.settings.br_min = m; save(); renderBreath(); }; ms.append(b); });
    $('brPat').textContent = `${t(PATS[db.settings.br_pat].name).toUpperCase()} · ${PATS[db.settings.br_pat].ph.map(x => x[1]).join('-')}`;
    if(!br){ $('brWord').textContent = t('brReady'); $('brCount').textContent = ''; $('brLeft').textContent = `${db.settings.br_min}:00`; }
  }

  /* ===== LOG ===== */
  function renderLog(){
    // 週ごとの合計（8週）
    const W = 340, H = 160, L = 30, B = 22, T = 16;
    const ws0 = weekStart(new Date()), weeks = [];
    for(let i = 7; i >= 0; i--){ const s = new Date(ws0); s.setDate(s.getDate() - 7 * i); const e = new Date(s); e.setDate(e.getDate() + 7); weeks.push({s, v:sumMin(logsIn(s, e))}); }
    const goal = +db.settings.week_goal_min || 0, max = Math.max(60, goal, ...weeks.map(w => w.v)) * 1.15;
    const bw = (W - L) / 8, y = v => T + (H - T - B) * (1 - v / max);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="weekly minutes">`;
    [0, .5, 1].forEach(f => { const v = max / 1.15 * f; s += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#333"/><text class="ax" x="${L - 4}" y="${y(v) + 3}" text-anchor="end">${Math.round(v)}</text>`; });
    weeks.forEach((w, i) => {
      const x = L + i * bw + 5, cur = i === 7;
      if(w.v > 0){ s += `<rect x="${x}" y="${y(w.v)}" width="${bw - 10}" height="${H - B - y(w.v)}" fill="${cur ? '#ceff00' : (goal && w.v >= goal ? '#ffffff' : '#777')}"/><text class="vl" x="${x + (bw - 10) / 2}" y="${y(w.v) - 4}" text-anchor="middle">${w.v}</text>`; }
      s += `<text class="ax" x="${x + (bw - 10) / 2}" y="${H - 6}" text-anchor="middle">${w.s.getMonth() + 1}/${w.s.getDate()}</text>`;
    });
    if(goal) s += `<line x1="${L}" x2="${W}" y1="${y(goal)}" y2="${y(goal)}" stroke="#ceff00" stroke-dasharray="4 4"/><text class="ax" x="${L + 4}" y="${y(goal) - 4}" style="fill:#ceff00">GOAL ${goal}</text>`;
    $('chWeek').innerHTML = s + '</svg>';

    // 今月の種目別
    const now = new Date(), ms = new Date(now.getFullYear(), now.getMonth(), 1), me = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    const by = {};
    logsIn(ms, me).forEach(l => { by[l.type] = (by[l.type] || 0) + (+l.min || 0); });
    const arr = Object.entries(by).sort((a, b) => b[1] - a[1]), mx = Math.max(1, ...arr.map(a => a[1]));
    $('brk').innerHTML = arr.length ? arr.map(([k, v]) => `<div><span>${esc(typeLabel(k))}</span><i style="width:${Math.max(4, v / mx * 100)}%"></i><b>${v} min</b></div>`).join('') : `<div class="empty" style="display:block">${t('noLogs')}</div>`;

    // 履歴
    const all = db.logs.slice().sort((a, b) => a.at < b.at ? 1 : -1);
    $('histSum').textContent = t('nEntries', {n:all.length, m:sumMin(all)});
    const h = $('hist'); h.innerHTML = '';
    if(!all.length){ h.innerHTML = `<div class="empty">${t('noLogs')}</div>`; }
    let curDay = '', wrap = null;
    all.slice(0, 120).forEach(l => {
      const d = new Date(l.at), k = fmtD(d);
      if(k !== curDay){
        curDay = k;
        const dayMin = sumMin(all.filter(x => fmtD(new Date(x.at)) === k));
        const hd = document.createElement('div'); hd.className = 'day-h'; hd.innerHTML = `<span>${k.replace(/-/g, '.')} ${WD[LANG][d.getDay()]}</span><small>${dayMin} min</small>`;
        h.append(hd);
        wrap = document.createElement('div'); wrap.style.borderTop = '2px solid #000'; h.append(wrap);
      }
      wrap.append(entRow(l));
    });
    $('goalIn').value = db.settings.week_goal_min || '';
  }
  $('goalSave').onclick = () => { db.settings.week_goal_min = Math.max(0, parseInt($('goalIn').value) || 0); save(); toast(t('saved')); renderLog(); };
  $('bkOut').onclick = () => { $('bkArea').value = JSON.stringify(db); $('bkArea').select(); };
  $('bkIn').onclick = () => {
    let d; try{ d = JSON.parse($('bkArea').value.trim()); }catch(e){}
    if(!d || !Array.isArray(d.logs)){ toast(t('bkBad')); return; }
    const ids = new Set(db.logs.map(l => l.id)), fids = new Set(db.flows.map(f => f.id));
    const add = d.logs.filter(l => l && l.id && l.at && !ids.has(l.id));
    db.logs = db.logs.concat(add);
    db.flows = db.flows.concat((d.flows || []).filter(f => f && f.id && !fids.has(f.id)));
    db.types = [...new Set(db.types.concat(d.types || []))];
    save(); toast(t('bkDone', {n:add.length})); render();
  };

  /* ===== タブ ===== */
  let current = 'today';
  const TITLES = {today:'Active', flow:'Flow', breath:'Breath', log:'Log'};
  function go(v){
    if(br && v !== 'breath') brStop(false);
    current = v;
    document.querySelectorAll('.view').forEach(el => el.classList.toggle('active', el.id === 'v-' + v));
    document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.v === v));
    $('viewTitle').textContent = TITLES[v];
    if(v === 'flow' && ed) closeEditor();
    render(); window.scrollTo(0, 0);
  }
  document.querySelectorAll('.tab').forEach(el => el.onclick = () => go(el.dataset.v));
  function renderBar(){ const d = new Date(); $('barSub').innerHTML = `<b>ACTIVE</b><br>${fmtD(d).replace(/-/g, '.')} ${WD[LANG][d.getDay()]}`; }
  function render(){
    renderBar();
    ({today:renderToday, flow:() => { if(!ed) renderFlowList(); }, breath:renderBreath, log:renderLog})[current]();
  }
  function applyLang(){
    document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
    document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
    render();
  }
  window.addEventListener('tdiv:lang', e => { LANG = e.detail; applyLang(); if(pl) plRender(); });
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && (pl && !pl.done || br)) wake(true); });

  applyLang();
  if('serviceWorker' in navigator && location.protocol === 'https:'){
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();
</script>
</body>
</html>
