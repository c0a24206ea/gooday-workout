<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TIVS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>TIVS</title>
<script src="menu.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fdfdfd; --white:#ffffff; --black:#000000; --lime:#ceff00; --g1:#eeeeee; --g2:#cccccc; --g3:#aaaaaa; --shadow:rgba(0,0,0,.1); --appw:480px;}
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  ::selection{background:var(--lime); color:var(--black);}
  html,body{height:100%;}
  body{background:var(--g1); color:var(--black); font-family:'Noto Sans JP',sans-serif; -webkit-font-smoothing:antialiased;}
  .app{max-width:var(--appw); margin:0 auto; min-height:100%; background:var(--bg); box-shadow:0 0 40px var(--shadow); padding-bottom:calc(env(safe-area-inset-bottom) + 40px);}
  .appbar{position:sticky; top:0; z-index:20; background:var(--white); border-bottom:1px solid var(--g1);
    padding:calc(env(safe-area-inset-top) + 12px) 20px 12px; display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .brand{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-style:italic; text-transform:uppercase; font-size:24px; line-height:.95; letter-spacing:.01em;}
  .brand::after{content:''; display:block; width:30px; height:4px; background:var(--lime); margin-top:6px; transform:skewX(-20deg);}
  main{padding:20px 20px 0; animation:in .5s ease;}
  @keyframes in{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}

  .label{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase;}
  .dim{color:var(--g3);}
  .section-t{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-style:italic; text-transform:uppercase; font-size:24px; margin:28px 0 12px; display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .section-t small{font-family:'JetBrains Mono',monospace; font-style:normal; font-weight:500; font-size:11px; letter-spacing:.1em;}

  .today{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; padding-bottom:16px; border-bottom:2px solid var(--black);}
  .today .d{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-style:italic; font-size:76px; line-height:.8; letter-spacing:-.01em;}
  .today .d small{font-size:30px; margin-left:8px;}
  .today .msg{font-size:14px; font-weight:700; text-align:right; line-height:1.5;}

  .tiles{display:grid; gap:12px; margin-top:16px;}
  .tile{position:relative; display:block; text-decoration:none; color:inherit; padding:18px 20px 20px; overflow:hidden; min-height:220px;
    transition:transform .35s ease, box-shadow .35s ease;}
  .tile:hover{transform:translateY(-3px); box-shadow:0 10px 24px var(--shadow);}
  .tile:focus-visible{outline:none; box-shadow:0 0 0 4px var(--black), 0 0 0 7px var(--lime);}
  .tile .hd{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .tile h2{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-style:italic; font-size:48px; line-height:.85; text-transform:uppercase;}
  .tile h2 small{display:block; font-family:'Noto Sans JP',sans-serif; font-style:normal; font-weight:700; font-size:12px; margin-top:8px; letter-spacing:.06em;}
  .tile .go{width:48px; height:48px; flex:none; display:flex; align-items:center; justify-content:center; transition:transform .35s ease;}
  .tile:hover .go{transform:translateX(4px);}
  .tile .go svg{width:24px; height:24px;}
  .tile .big{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-style:italic; font-size:64px; line-height:.9; margin-top:18px; white-space:nowrap;}
  .tile .big small{font-size:24px; font-style:normal; margin-left:4px;}
  .tile .meta{font-family:'JetBrains Mono',monospace; font-size:12px; line-height:1.7; margin-top:8px;}
  .tile ul{list-style:none; margin-top:12px; font-size:13px; line-height:1.9;}
  .tile li{display:flex; justify-content:space-between; gap:10px; border-top:1px solid rgba(0,0,0,.15);}
  .tile li span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tile li b{font-family:'JetBrains Mono',monospace; font-size:12px; white-space:nowrap;}
  .tile .bar{height:8px; margin-top:12px; position:relative; overflow:hidden;}
  .tile .bar i{position:absolute; left:0; top:0; bottom:0; transition:width 1s ease;}

  .t-wo{background:var(--lime);}
  .t-wo .go{background:var(--black); color:var(--lime);}
  .t-wo .bar{background:rgba(0,0,0,.15);} .t-wo .bar i{background:var(--black);}
  .t-wo::after{content:''; position:absolute; right:-40px; bottom:-20px; width:120px; height:160px; background:var(--black); transform:skewX(-20deg); opacity:.06;}

  .t-run{background:var(--black); color:var(--white);}
  .t-run .go{background:var(--lime); color:var(--black);}
  .t-run .big{color:var(--lime);}
  .t-run .meta{color:var(--g3);}
  .t-run .bar{background:#333;} .t-run .bar i{background:var(--lime);}
  .t-run li{border-top-color:#333;}
  .t-run::after{content:''; position:absolute; right:-40px; bottom:-20px; width:120px; height:160px; background:var(--lime); transform:skewX(-20deg); opacity:.1;}

  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .mini{background:var(--white); border:1px solid var(--g1); padding:12px; min-width:0;}
  .mini .n{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:30px; line-height:1; margin-top:4px; white-space:nowrap;}
  .mini .n small{font-size:13px; margin-left:2px;}
  .mini .s{font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--g3); margin-top:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* 達成度ヒートマップ: 列=週, 行=曜日（月→日） */
  .hm-sum{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px;}
  .hm-sum > div{border-left:4px solid var(--black); padding:2px 0 2px 10px;}
  .hm-sum b{display:block; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:30px; line-height:1; margin-top:4px;}
  .hm-sum b small{font-size:14px; margin-left:2px;}
  .hm-wrap{display:grid; grid-template-columns:auto 1fr; gap:6px;}
  .hm-wd{display:grid; grid-template-rows:repeat(7,1fr); gap:3px; margin-top:16px; font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--g3);}
  .hm-wd span{display:flex; align-items:center; line-height:1;}
  .hm-main{min-width:0;}
  .hm-mo{display:grid; gap:3px; height:16px; font-family:'JetBrains Mono',monospace; font-size:10px; color:#555;}
  .hm-mo span{white-space:nowrap; overflow:visible;}
  .hm{display:grid; grid-template-rows:repeat(7,auto); grid-auto-flow:column; gap:3px;}
  .hm button{all:unset; box-sizing:border-box; aspect-ratio:1; width:100%; background:var(--g1); position:relative; cursor:pointer;}
  .hm button:focus-visible{outline:2px solid var(--black); outline-offset:1px; z-index:1;}
  .hm button.l1{background:#f1ffb8;} .hm button.l2{background:#e0ff66;} .hm button.l3{background:var(--lime);} .hm button.l4{background:var(--black);}
  .hm button.l0{background:var(--g2);}
  .hm button.fut{background:transparent; cursor:default;}
  .hm button.today{box-shadow:inset 0 0 0 2px var(--black);}
  .hm button.l4.today{box-shadow:inset 0 0 0 2px var(--lime);}
  .hm button.sel{outline:2px solid var(--black); outline-offset:1px; z-index:1;}
  .hm button .r{position:absolute; right:14%; bottom:14%; width:30%; height:30%; border-radius:50%; background:var(--black);}
  .hm button.l4 .r{background:var(--lime);}
  .hm-leg{display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; margin-top:10px; font-family:'JetBrains Mono',monospace; font-size:10px; color:#555;}
  .hm-leg .sc{display:inline-flex; align-items:center; gap:3px;}
  .hm-leg i{display:inline-block; width:11px; height:11px; background:var(--k); position:relative;}
  .hm-leg i.dot::after{content:''; position:absolute; inset:2px; border-radius:50%; background:var(--black);}
  .hm-det{margin-top:12px; min-height:52px; background:var(--white); border:1px solid var(--g1); border-left:6px solid var(--lime); padding:10px 14px; font-size:13px; line-height:1.6;}
  .hm-det b{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:20px; margin-right:8px;}
  .hm-det small{display:block; font-family:'JetBrains Mono',monospace; font-size:11px; color:#555;}

  .feed{border-top:2px solid var(--black);}
  .fi{display:grid; grid-template-columns:54px 8px 1fr auto; gap:12px; align-items:center; padding:12px 2px; border-bottom:1px solid var(--g1); text-decoration:none; color:inherit;}
  .fi:hover{background:var(--white);}
  .fi .d{font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700;}
  .fi .k{width:8px; height:28px; transform:skewX(-20deg);}
  .fi .k.w{background:var(--black);} .fi .k.r{background:var(--lime);}
  .fi .m{font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
  .fi .m small{display:block; font-size:11px; color:var(--g3);}
  .fi .v{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:22px; white-space:nowrap;}
  .empty{padding:24px 0; text-align:center; color:var(--g3); font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.14em;}

  @media (min-width:768px){
    :root{--appw:100%;}
    .app{box-shadow:none;}
    main,.appbar{padding-left:max(28px, env(safe-area-inset-left)); padding-right:max(28px, env(safe-area-inset-right));}
    main{padding-top:28px;}
    .tiles{grid-template-columns:1fr 1fr; gap:16px;}
    .tile{min-height:280px; padding:24px 28px;}
    .tile h2{font-size:64px;}
    .tile .big{font-size:84px;}
    .cols{display:grid; grid-template-columns:1fr 1fr; gap:28px; align-items:start;}
    .hm-wd{font-size:10px;}
  }
  @media (orientation:landscape) and (max-height:520px){
    .appbar{position:static; padding-top:calc(env(safe-area-inset-top) + 8px); padding-bottom:8px;}
    .tiles{grid-template-columns:1fr 1fr;}
    .tile{min-height:0;}
    .today .d{font-size:56px;}
  }
  @media (prefers-reduced-motion: reduce){ main{animation:none;} .tile,.tile .go{transition:none;} }
</style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <div class="brand">Training<br>Division</div>
    <div data-menu-slot></div>
  </header>

  <main>
    <div class="today">
      <div class="d" id="tDate">—</div>
      <div class="msg" id="tMsg"></div>
    </div>

    <div class="tiles">
      <a class="tile t-wo" href="workout.html">
        <div class="hd"><h2>Workout<small data-i18n="workout"></small></h2><span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>
        <div class="big" id="woRate">—</div>
        <div class="bar"><i id="woBar" style="width:0"></i></div>
        <div class="meta" id="woMeta"></div>
        <ul id="woList"></ul>
      </a>
      <a class="tile t-run" href="run.html">
        <div class="hd"><h2>Running<small data-i18n="run"></small></h2><span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>
        <div class="big" id="rnKm">—</div>
        <div class="bar"><i id="rnBar" style="width:0"></i></div>
        <div class="meta" id="rnMeta"></div>
        <ul id="rnList"></ul>
      </a>
    </div>

    <div class="section-t"><span>Achievement</span><small id="hmRange"></small></div>
    <div class="hm-sum" id="hmSum"></div>
    <div class="hm-wrap">
      <div class="hm-wd" id="hmWd"></div>
      <div class="hm-main"><div class="hm-mo" id="hmMo"></div><div class="hm" id="heat" role="grid"></div></div>
    </div>
    <div class="hm-leg" id="hmLeg"></div>
    <div class="hm-det" id="hmDet" aria-live="polite"></div>

    <div class="cols">
      <div>
        <div class="section-t"><span>Stats</span></div>
        <div class="stats" id="stats"></div>
      </div>
      <div>
        <div class="section-t"><span>Recent</span><small data-i18n="recent"></small></div>
        <div class="feed" id="feed"></div>
      </div>
    </div>
  </main>
</div>

<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const fmtD = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const read = k => { try{ return JSON.parse(localStorage.getItem(k) || 'null'); }catch(e){ return null; } };

  const I18N = {
    workout:{ja:'筋トレ', en:'Strength', ko:'근력 운동', zh:'力量训练'},
    run:{ja:'ランニング', en:'Running', ko:'러닝', zh:'跑步'},
    active:{ja:'動いた日', en:'active days', ko:'운동한 날', zh:'运动的日子'},
    recent:{ja:'最近の記録', en:'latest activity', ko:'최근 기록', zh:'最近记录'},
    rateToday:{ja:'今日の達成率', en:"today's completion", ko:'오늘 달성률', zh:'今日完成率'},
    noPlan:{ja:'今日のメニューは未設定', en:'No menu set for today', ko:'오늘 메뉴 없음', zh:'今天没有安排'},
    restDay:{ja:'今日は休み', en:'Rest day', ko:'휴식일', zh:'休息日'},
    sets:{ja:'{d}/{t} セット', en:'{d}/{t} sets', ko:'{d}/{t} 세트', zh:'{d}/{t} 组'},
    more:{ja:'ほか {n} 種目', en:'+{n} more', ko:'외 {n}종목', zh:'另外 {n} 项'},
    thisWeek:{ja:'今週', en:'this week', ko:'이번 주', zh:'本周'},
    goal:{ja:'目標 {g} km', en:'goal {g} km', ko:'목표 {g} km', zh:'目标 {g} km'},
    lastRun:{ja:'前回', en:'Last', ko:'지난번', zh:'上次'},
    noRun:{ja:'まだランの記録がありません', en:'No runs yet', ko:'아직 러닝 기록 없음', zh:'还没有跑步记录'},
    runs:{ja:'{n}回', en:'{n} runs', ko:'{n}회', zh:'{n}次'},
    streak:{ja:'連続日数', en:'Streak', ko:'연속 일수', zh:'连续天数'},
    days:{ja:'日', en:'d', ko:'일', zh:'天'},
    weight:{ja:'体重', en:'Weight', ko:'체중', zh:'体重'},
    month:{ja:'今月の運動日', en:'Days this month', ko:'이번 달 운동일', zh:'本月运动天数'},
    nothing:{ja:'まだ記録がありません', en:'NOTHING YET', ko:'아직 기록이 없습니다', zh:'还没有记录'},
    msg0:{ja:'さあ、始めよう。', en:"Let's get moving.", ko:'자, 시작해요.', zh:'开始吧。'},
    msg1:{ja:'今日も動けた。いいね。', en:'Already moved today. Nice.', ko:'오늘도 움직였네요. 좋아요.', zh:'今天也动起来了，很好。'},
    msgS:{ja:'{n}日連続！', en:'{n}-day streak!', ko:'{n}일 연속!', zh:'连续{n}天！'},
    exercises:{ja:'{n}種目', en:'{n} exercises', ko:'{n}종목', zh:'{n}个动作'},
    bw:{ja:'自重', en:'BW', ko:'맨몸', zh:'自重'},
    weeksN:{ja:'直近{n}週', en:'last {n} weeks', ko:'최근 {n}주', zh:'最近{n}周'},
    avgRate:{ja:'平均達成率', en:'Avg completion', ko:'평균 달성률', zh:'平均完成率'},
    fullDays:{ja:'100%の日', en:'100% days', ko:'100% 달성일', zh:'100%的天数'},
    actDays:{ja:'運動した日', en:'Active days', ko:'운동한 날', zh:'运动天数'},
    less:{ja:'低', en:'Less', ko:'낮음', zh:'低'},
    moreL:{ja:'高', en:'More', ko:'높음', zh:'高'},
    offPlan:{ja:'メニュー外', en:'No menu', ko:'메뉴 외', zh:'计划外'},
    runDot:{ja:'ラン', en:'Run', ko:'러닝', zh:'跑步'},
    tapDay:{ja:'マスを押すとその日の内容が出ます', en:'Tap a square to see that day', ko:'칸을 누르면 그날 내용이 보입니다', zh:'点方格查看当天内容'},
    rest:{ja:'記録なし', en:'No activity', ko:'기록 없음', zh:'无记录'},
    rateL:{ja:'達成率 {p}%', en:'{p}% complete', ko:'달성률 {p}%', zh:'完成率 {p}%'},
    setsN:{ja:'{n}セット', en:'{n} sets', ko:'{n}세트', zh:'{n}组'}
  };
  const WD = {ja:['日','月','火','水','木','金','土'], en:['SUN','MON','TUE','WED','THU','FRI','SAT'], ko:['일','월','화','수','목','금','토'], zh:['日','一','二','三','四','五','六']};
  let LANG = window.TDIV ? TDIV.lang() : 'ja';
  const t = (k, v) => { const e = I18N[k]; let r = e ? (e[LANG] != null ? e[LANG] : e.ja) : k; if(v) for(const x in v) r = r.split('{' + x + '}').join(v[x]); return r; };
  const pace = s => (!isFinite(s) || s <= 0) ? `--'--"` : `${Math.floor(s/60)}'${pad(Math.round(s%60) % 60)}"`;

  function render(){
    document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));

    /* ---- 筋トレのデータ（workout.html と同じ tdiv_v2）---- */
    const w = read('tdiv_v2') || {};
    const ex = w.exercises || [], items = w.routine_items || [], logs = w.workout_logs || [], sets = w.workout_sets || [], bws = w.body_weights || [];
    const st = w.settings || {}, hh = +st.day_start_hour || 0;
    const dayKey = ts => fmtD(new Date(new Date(ts).getTime() - hh * 3600000));
    const today = dayKey(Date.now()), wd = new Date(today + 'T12:00:00').getDay();
    const exName = id => (ex.find(e => e.id === id) || {}).name || '—';
    const dated = items.filter(r => r.date === today);
    const plan = (dated.length || st.plan_mode === 'daily' ? dated : items.filter(r => r.weekday === wd && !r.date))
      .filter(r => ex.some(e => e.id === r.exercise_id)).sort((a, b) => (a.order || 0) - (b.order || 0));
    const log = logs.find(l => dayKey(l.executed_at) === today);
    const isWork = s => !s.is_warmup && (s.reps || 0) > 0;
    const setsFor = id => log ? sets.filter(s => s.workout_log_id === log.id && s.exercise_id === id) : [];
    const rates = plan.filter(i => i.target_sets > 0).map(i => Math.min(1, setsFor(i.exercise_id).filter(s => isWork(s) && s.reps >= (i.target_reps || 0) && (!(i.target_weight > 0) || (s.weight || 0) >= i.target_weight)).length / i.target_sets));
    const rate = rates.length ? rates.reduce((a, b) => a + b, 0) / rates.length : null;
    const tgt = plan.reduce((a, i) => a + (i.target_sets || 0), 0);
    const done = log ? sets.filter(s => s.workout_log_id === log.id && isWork(s)).length : 0;

    $('woRate').innerHTML = rate == null ? (plan.length ? '0<small>%</small>' : '—') : `${Math.round(rate * 100)}<small>%</small>`;
    $('woBar').style.width = (rate == null ? 0 : rate * 100) + '%';
    const wsK = (() => { const d = new Date(today + 'T12:00:00'); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return fmtD(d); })();
    const wkDays = new Set(logs.filter(l => dayKey(l.executed_at) >= wsK && sets.some(s => s.workout_log_id === l.id && isWork(s))).map(l => dayKey(l.executed_at))).size;
    $('woMeta').textContent = (plan.length ? `${t('rateToday')} · ${t('sets', {d:done, t:tgt})}` : (done ? t('sets', {d:done, t:'—'}) : t('noPlan'))) + ` · ${t('thisWeek')} ${wkDays}${t('days')}`;
    $('woList').innerHTML = plan.slice(0, 4).map(i => {
      const c = setsFor(i.exercise_id).filter(isWork).length;
      const tw = i.target_weight > 0 ? `${i.target_weight}kg` : t('bw');
      return `<li><span>${esc(exName(i.exercise_id))}</span><b>${c}/${i.target_sets || 0} · ${tw}×${i.target_reps || '—'}</b></li>`;
    }).join('') + (plan.length > 4 ? `<li><span>${t('more', {n:plan.length - 4})}</span><b></b></li>` : '');

    /* ---- ランのデータ（run.html の tdiv_run_v1）---- */
    const r = read('tdiv_run_v1') || {};
    const runs = (r.runs || []).slice().sort((a, b) => a.started_at < b.started_at ? 1 : -1);
    const goal = +((r.settings || {}).week_goal_km) || 0;
    const now = new Date(), ws = new Date(now.getFullYear(), now.getMonth(), now.getDate()); ws.setDate(ws.getDate() - (ws.getDay() + 6) % 7);
    const wk = runs.filter(x => new Date(x.started_at) >= ws);
    const wkKm = wk.reduce((a, x) => a + (x.distance_km || 0), 0);
    $('rnKm').innerHTML = `${wkKm.toFixed(1)}<small>km</small>`;
    $('rnBar').style.width = (goal ? Math.min(100, wkKm / goal * 100) : 0) + '%';
    $('rnMeta').textContent = `${t('thisWeek')} · ${t('runs', {n:wk.length})}${goal ? ' · ' + t('goal', {g:goal}) : ''}`;
    $('rnList').innerHTML = runs.length ? runs.slice(0, 2).map(x => {
      const d = new Date(x.started_at), p = x.distance_km > 0 && x.duration_sec > 0 ? x.duration_sec / x.distance_km : NaN;
      return `<li><span>${d.getMonth() + 1}/${d.getDate()} ${WD[LANG][d.getDay()]}</span><b>${(x.distance_km || 0).toFixed(2)} km · ${pace(p)}</b></li>`;
    }).join('') : `<li><span>${t('noRun')}</span><b></b></li>`;

    /* ---- 動いた日（筋トレ or ラン）---- */
    const wDays = new Set(logs.filter(l => sets.some(s => s.workout_log_id === l.id && isWork(s)) || l.duration_min).map(l => dayKey(l.executed_at)));
    const rDays = new Set(runs.map(x => fmtD(new Date(x.started_at))));
    const any = k => wDays.has(k) || rDays.has(k);
    let streak = 0;
    const c = new Date(today + 'T12:00:00');
    if(!any(fmtD(c))) c.setDate(c.getDate() - 1);
    while(any(fmtD(c))){ streak++; c.setDate(c.getDate() - 1); }
    const ym = today.slice(0, 7);
    const monthDays = new Set([...wDays, ...rDays].filter(k => k.startsWith(ym))).size;
    const lastBw = bws.slice().sort((a, b) => a.measured_at < b.measured_at ? 1 : -1)[0];
    $('stats').innerHTML = `
      <div class="mini"><div class="label dim">${t('streak')}</div><div class="n">${streak}<small>${t('days')}</small></div><div class="s">STREAK</div></div>
      <div class="mini"><div class="label dim">${t('weight')}</div><div class="n">${lastBw ? (+lastBw.weight_kg).toFixed(1) : '—'}<small>kg</small></div><div class="s">${lastBw ? fmtD(new Date(lastBw.measured_at)) : 'BODY'}</div></div>
      <div class="mini"><div class="label dim">${t('month')}</div><div class="n">${monthDays}<small>${t('days')}</small></div><div class="s">${ym.replace('-', '.')}</div></div>`;

    /* ---- 達成度ヒートマップ ----
     * 色 = その日の筋トレ達成率（記録したときのメニュー routine_snapshot 基準）
     *   l1: 1〜49%  l2: 50〜79%  l3: 80〜99%  l4: 100%（黒）  l0: メニュー外で記録だけ（グレー）
     * 丸 = ランした日 */
    const rateOf = l => {
      const items = l.routine_snapshot || [];
      const rs = items.filter(i => i.target_sets > 0).map(i => Math.min(1, sets.filter(s => s.workout_log_id === l.id && s.exercise_id === i.exercise_id && isWork(s) && s.reps >= (i.target_reps || 0) && (!(i.target_weight > 0) || (s.weight || 0) >= i.target_weight)).length / i.target_sets));
      return rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : null;
    };
    const dayInfo = {};
    logs.forEach(l => {
      const k = dayKey(l.executed_at), n = sets.filter(s => s.workout_log_id === l.id && isWork(s)).length;
      if(!n) return;
      const r = k === today ? rate : rateOf(l);
      dayInfo[k] = {rate:r, sets:n};
    });
    const runKm = {};
    runs.forEach(x => { const k = fmtD(new Date(x.started_at)); runKm[k] = (runKm[k] || 0) + (x.distance_km || 0); });
    const lvl = r => r == null ? 'l0' : r >= 1 ? 'l4' : r >= .8 ? 'l3' : r >= .5 ? 'l2' : r > 0 ? 'l1' : 'l0';
    const WEEKS = window.matchMedia('(min-width:768px)').matches ? 52 : 17;
    const tD = new Date(today + 'T12:00:00');
    const start = new Date(tD); start.setDate(start.getDate() - (start.getDay() + 6) % 7 - 7 * (WEEKS - 1));
    let cells = '', mo = '', lastM = -1, act = 0, full = 0, rsum = 0, rcnt = 0;
    for(let w = 0; w < WEEKS; w++){
      const first = new Date(start); first.setDate(first.getDate() + w * 7);
      // 月の頭の週に月ラベル
      const m = new Date(first); m.setDate(m.getDate() + 6);
      // 最初の列は、その月の日が少ない（すぐ次の月になる）ならラベルを省いて重なりを防ぐ
      if(m.getMonth() !== lastM){ if(!(w === 0 && m.getDate() > 14)) mo += `<span style="grid-column:${w + 1}">${m.getMonth() + 1}${LANG === 'en' ? '' : '月'}</span>`; lastM = m.getMonth(); }
      for(let d = 0; d < 7; d++){
        const day = new Date(first); day.setDate(day.getDate() + d);
        const k = fmtD(day);
        if(k > today){ cells += `<button class="fut" tabindex="-1" aria-hidden="true"></button>`; continue; }
        const inf = dayInfo[k], km = runKm[k];
        if(inf || km) act++;
        if(inf && inf.rate != null){ rsum += inf.rate; rcnt++; if(inf.rate >= 1) full++; }
        const cls = inf ? lvl(inf.rate) : '';
        cells += `<button data-k="${k}" class="${cls}${k === today ? ' today' : ''}" aria-label="${k}">${km ? '<span class="r"></span>' : ''}</button>`;
      }
    }
    $('heat').style.gridTemplateColumns = `repeat(${WEEKS}, 1fr)`;
    $('hmMo').style.gridTemplateColumns = `repeat(${WEEKS}, 1fr)`;
    $('heat').innerHTML = cells;
    $('hmMo').innerHTML = mo;
    $('hmWd').innerHTML = [1, 2, 3, 4, 5, 6, 0].map((d, i) => `<span>${i % 2 === 0 ? WD[LANG][d] : ''}</span>`).join('');
    $('hmRange').textContent = t('weeksN', {n:WEEKS});
    $('hmSum').innerHTML = `
      <div><span class="label dim">${t('avgRate')}</span><b>${rcnt ? Math.round(rsum / rcnt * 100) : '—'}<small>%</small></b></div>
      <div><span class="label dim">${t('fullDays')}</span><b>${full}<small>${t('days')}</small></b></div>
      <div><span class="label dim">${t('actDays')}</span><b>${act}<small>${t('days')}</small></b></div>`;
    $('hmLeg').innerHTML = `<span class="sc">${t('less')} <i style="--k:#eeeeee"></i><i style="--k:#f1ffb8"></i><i style="--k:#e0ff66"></i><i style="--k:#ceff00"></i><i style="--k:#000"></i> ${t('moreL')}(100%)</span>
      <span class="sc"><i style="--k:#cccccc"></i> ${t('offPlan')}</span><span class="sc"><i class="dot" style="--k:#eeeeee"></i> ${t('runDot')}</span>`;
    const showDay = k => {
      $('heat').querySelectorAll('.sel').forEach(b => b.classList.remove('sel'));
      const b = $('heat').querySelector(`[data-k="${k}"]`); if(b) b.classList.add('sel');
      const d = new Date(k + 'T12:00:00'), inf = dayInfo[k], km = runKm[k];
      const parts = [];
      if(inf) parts.push(inf.rate == null ? `${t('offPlan')} · ${t('setsN', {n:inf.sets})}` : `${t('rateL', {p:Math.round(inf.rate * 100)})} · ${t('setsN', {n:inf.sets})}`);
      if(km) parts.push(`${t('runDot')} ${km.toFixed(2)} km`);
      $('hmDet').innerHTML = `<b>${d.getMonth() + 1}/${d.getDate()} ${WD[LANG][d.getDay()]}</b>${parts.length ? parts.join('<br>') : t('rest')}`;
    };
    $('heat').onclick = e => { const b = e.target.closest('button[data-k]'); if(b) showDay(b.dataset.k); };
    $('hmDet').innerHTML = `<small>${t('tapDay')}</small>`;

    // 日付と一言
    const dd = new Date(today + 'T12:00:00');
    $('tDate').innerHTML = `${dd.getMonth() + 1}.${pad(dd.getDate())}<small>${WD[LANG][dd.getDay()]}</small>`;
    $('tMsg').textContent = streak > 1 ? t('msgS', {n:streak}) : any(today) ? t('msg1') : t('msg0');

    // 最近の記録（筋トレ + ラン）
    const feed = [];
    logs.forEach(l => {
      const ws2 = sets.filter(s => s.workout_log_id === l.id && isWork(s));
      if(!ws2.length) return;
      const ids = [...new Set(ws2.map(s => s.exercise_id))];
      feed.push({at:l.executed_at, k:'w', href:'workout.html', m:ids.slice(0, 3).map(exName).join(' / ') + (ids.length > 3 ? ' …' : ''), s:t('exercises', {n:ids.length}), v:`${ws2.length} SETS`});
    });
    runs.forEach(x => {
      const p = x.distance_km > 0 && x.duration_sec > 0 ? x.duration_sec / x.distance_km : NaN;
      feed.push({at:x.started_at, k:'r', href:'run.html', m:x.memo || t('run'), s:pace(p) + ' /km', v:`${(x.distance_km || 0).toFixed(2)} KM`});
    });
    feed.sort((a, b) => a.at < b.at ? 1 : -1);
    $('feed').innerHTML = feed.length ? feed.slice(0, 6).map(f => {
      const d = new Date(f.at);
      return `<a class="fi" href="${f.href}"><span class="d">${pad(d.getMonth() + 1)}/${pad(d.getDate())}</span><span class="k ${f.k}"></span><span class="m">${esc(f.m)}<small>${esc(f.s)}</small></span><span class="v">${f.v}</span></a>`;
    }).join('') : `<div class="empty">${t('nothing')}</div>`;
  }

  window.addEventListener('tdiv:lang', e => { LANG = e.detail; render(); });
  // 他のページから戻ってきたとき（キャッシュから復元されたときも）最新にする
  window.addEventListener('pageshow', render);
  window.matchMedia('(min-width:768px)').addEventListener('change', render);
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') render(); });
  render();
  if('serviceWorker' in navigator && location.protocol === 'https:'){
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();
</script>
</body>
</html>
