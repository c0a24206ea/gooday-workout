<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TRAINING">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>TRAINING DIVISION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Palette: only colors used on zetadivision.com */
  :root{
    --bg:#fdfdfd;
    --white:#ffffff;
    --black:#000000;
    --lime:#ceff00;
    --g1:#eeeeee;
    --g2:#cccccc;
    --g3:#aaaaaa;
    --shadow:rgba(0,0,0,.1);
    --tabh:64px;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  ::selection{background:var(--lime); color:var(--black);}
  html,body{height:100%;}
  body{
    background:var(--g1); color:var(--black);
    font-family:'Noto Sans JP',sans-serif; -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; color:var(--black);}
  input,select,textarea{font-family:inherit; color:var(--black);}

  /* ---------- App shell ---------- */
  .app{
    max-width:480px; margin:0 auto; min-height:100%; background:var(--bg);
    position:relative; box-shadow:0 0 40px var(--shadow);
    padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 96px);
  }
  .appbar{
    position:sticky; top:0; z-index:20; background:var(--white);
    border-bottom:1px solid var(--g1);
    padding:calc(env(safe-area-inset-top) + 12px) 20px 12px;
    display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
  }
  .appbar h1{
    font-family:'Barlow Condensed',sans-serif; font-weight:800; font-style:italic; text-transform:uppercase;
    font-size:34px; line-height:.95; letter-spacing:.01em;
  }
  .appbar h1::after{content:''; display:block; width:30px; height:4px; background:var(--lime); margin-top:6px; transform:skewX(-20deg);}
  .appbar .sub{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; text-align:right; line-height:1.5;}
  .appbar .sub b{display:inline-block; background:var(--lime); padding:1px 6px; font-weight:700;}
  .bar-r{display:flex; flex-direction:column; align-items:flex-end; gap:6px;}
  .lang-top{height:30px; border:1px solid var(--black); background:var(--white); font-size:13px; font-weight:700; padding:0 6px; border-radius:0; color:var(--black); cursor:pointer;}
  .lang-top:focus{outline:none; box-shadow:inset 0 0 0 2px var(--lime);}

  .view{display:none; padding:20px 20px 0; animation:in .22s ease;}
  .view.active{display:block;}
  @keyframes in{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}

  /* ---------- Bottom tab bar ---------- */
  .tabbar{
    position:fixed; left:50%; transform:translateX(-50%); bottom:0; z-index:30;
    width:100%; max-width:480px; background:var(--white); border-top:1px solid var(--g1);
    display:grid; grid-template-columns:repeat(4,1fr);
    padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 -4px 16px var(--shadow);
  }
  .tab{
    position:relative; height:var(--tabh); background:none; border:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    color:var(--g3); font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:.1em; font-size:12px; text-transform:uppercase;
  }
  .tab svg{width:22px; height:22px;}
  .tab::before{content:''; position:absolute; top:-1px; left:20%; right:20%; height:3px; background:var(--lime); transform:scaleX(0); transition:transform .2s;}
  .tab.active{color:var(--black);}
  .tab.active::before{transform:scaleX(1);}

  /* ---------- Common ---------- */
  .label{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase;}
  .label.dim{color:var(--g3);}
  .section-t{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-style:italic; text-transform:uppercase; font-size:24px; margin:26px 0 12px; display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .section-t small{font-family:'JetBrains Mono',monospace; font-style:normal; font-weight:500; font-size:11px; letter-spacing:.1em;}
  .empty{padding:30px 0; text-align:center; color:var(--g3); font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.14em;}
  .tags{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;}
  .tg{font-family:'JetBrains Mono',monospace; font-size:10px; background:var(--lime); color:var(--black); padding:2px 7px; font-weight:700; white-space:nowrap;}
  .tg.plain{background:var(--g1);}
  .tg.pr{background:var(--black); color:var(--lime);}

  .btn{
    font-family:'Barlow Condensed','Noto Sans JP',sans-serif; font-weight:800; font-size:18px; letter-spacing:.12em; text-transform:uppercase;
    background:var(--black); color:var(--white); border:1px solid var(--black); padding:0 24px; height:50px; cursor:pointer; border-radius:0; transition:background .12s, color .12s;
  }
  .btn:active, .btn:hover{background:var(--lime); color:var(--black);}
  .btn.line{background:var(--white); color:var(--black);}
  .btn.line:active, .btn.line:hover{background:var(--lime);}
  .btn.block{width:100%;}
  .btn.sm{height:40px; font-size:15px; padding:0 14px; letter-spacing:.06em;}

  /* ---------- Today ---------- */
  .hero{background:var(--lime); padding:20px 20px 18px; position:relative; overflow:hidden;}
  .hero::after{content:''; position:absolute; right:-30px; top:-20px; width:120px; height:200px; background:var(--white); opacity:.35; transform:skewX(-18deg);}
  .hero-row{display:flex; align-items:flex-end; justify-content:space-between; position:relative; z-index:1;}
  .hero-num{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-style:italic; font-size:96px; line-height:.8;}
  .hero-num small{font-size:36px; margin-left:2px;}
  #rateNum{display:inline-block; font-variant-numeric:tabular-nums;}
  /* 達成率のグリッチ演出（ジジジ…と数字が乱れてから確定） */
  .hero-num.glitch{transform:translateX(var(--gx,0)) skewX(var(--gs,0)); text-shadow:3px 0 0 #ffffff, -3px 0 0 rgba(0,0,0,.28);}
  .hero-num.glitch #rateNum{animation:flick .08s steps(2) infinite;}
  .hero-num.lock{animation:lockin .28s ease-out;}
  @keyframes flick{50%{opacity:.6; clip-path:inset(0 0 38% 0);}}
  @keyframes lockin{0%{transform:scale(1.08); text-shadow:5px 0 0 #ffffff;} 100%{transform:none; text-shadow:none;}}
  .tbig.glitch{transform:translateX(var(--gx,0)) skewX(var(--gs,0)); text-shadow:3px 0 0 #ffffff, -3px 0 0 #aaaaaa; animation:flick .08s steps(2) infinite;}
  .tbig.lock{animation:lockin2 .28s ease-out;}
  @keyframes lockin2{0%{transform:scale(1.06); text-shadow:4px 0 0 #ffffff;} 100%{transform:none; text-shadow:none;}}
  @media (prefers-reduced-motion: reduce){ .hero-num.glitch,.hero-num.lock,.tbig.glitch,.tbig.lock{animation:none; transform:none; text-shadow:none;} }
  .hero-side{text-align:right; padding-bottom:6px;}
  .hero-side .big{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:30px; line-height:1;}
  .hero-bar{height:10px; background:var(--white); margin-top:18px; position:relative; z-index:1; transform:skewX(-20deg); overflow:hidden;}
  .hero-bar i{position:absolute; left:0; top:0; bottom:0; background:var(--black); transition:width .5s ease;}

  .minis{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:10px;}
  .mini{background:var(--white); border:1px solid var(--g1); padding:12px 12px 10px; min-width:0;}
  .mini .n{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:30px; line-height:1; margin-top:4px; white-space:nowrap;}
  .mini .n small{font-size:14px; font-weight:700;}

  .ex{background:var(--white); border:1px solid var(--g1); margin-bottom:10px; position:relative; transition:border-color .15s;}
  .ex::before{content:''; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--g1); transition:background .2s;}
  .ex.done::before{background:var(--lime);}
  .ex.done{border-color:var(--black);}
  .ex-top{display:flex; align-items:flex-start; gap:12px; padding:14px 14px 0 18px;}
  .ex-head{flex:1; min-width:0;}
  .ex-title{font-weight:700; font-size:17px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .ex-pct{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:34px; line-height:1; white-space:nowrap;}
  .ex-pct small{font-size:14px;}
  .prev{padding:10px 14px 0 18px; font-family:'JetBrains Mono',monospace; font-size:12px; line-height:1.6;}
  .prev .label{margin-right:6px;}
  .sets{padding:12px 14px 0 18px;}
  .set-h,.set-row{display:grid; grid-template-columns:24px 1fr 1fr 56px 34px 28px; gap:6px; align-items:center;}
  .set-h{margin-bottom:4px;}
  .set-h span{text-align:center;}
  .set-row{margin-bottom:6px;}
  .sn{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:20px; text-align:center;}
  .set-row input{
    width:100%; min-width:0; height:42px; border:1px solid var(--g2); background:var(--bg);
    font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:24px; text-align:center; border-radius:0;
  }
  .set-row input:focus,.set-row select:focus{outline:none; border-color:var(--black); background:var(--white);}
  .set-row select{
    width:100%; height:42px; border:1px solid var(--g2); background:var(--bg); border-radius:0;
    font-family:'JetBrains Mono',monospace; font-size:16px; text-align:center; text-align-last:center; -webkit-appearance:none; appearance:none;
  }
  .set-row.warm input,.set-row.warm select{color:var(--g3);}
  .wu{height:42px; border:1px solid var(--g2); background:var(--white); font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:16px; color:var(--g3); cursor:pointer;}
  .wu.on{background:var(--black); color:var(--lime); border-color:var(--black);}
  .del{background:none; border:none; color:var(--g3); font-size:22px; cursor:pointer; height:42px; line-height:1;}
  .del:active{color:var(--black);}
  .ex-actions{display:flex; gap:8px; padding:12px 14px 14px 18px; flex-wrap:wrap;}
  .ex-bar{height:4px; background:var(--g1);}
  .ex-bar i{display:block; height:100%; width:0; background:var(--black); transition:width .3s;}
  .ex.done .ex-bar i{background:var(--lime);}

  .row-add{display:flex; margin-top:14px;}
  .row-add select,.row-add input{flex:1; min-width:0; border:1px solid var(--black); border-right:none; padding:0 12px; height:50px; font-size:16px; font-weight:700; background:var(--white); border-radius:0;}
  .row-add select:focus,.row-add input:focus{outline:none; box-shadow:inset 0 0 0 2px var(--lime);}

  textarea{width:100%; border:1px solid var(--g2); background:var(--white); padding:12px; resize:vertical; border-radius:0; font-size:16px;}
  textarea:focus{outline:none; border-color:var(--black);}
  .memo{height:90px;}

  /* Rest timer */
  .rest{
    position:fixed; left:50%; transform:translateX(-50%); z-index:25;
    bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 10px);
    width:calc(100% - 32px); max-width:448px; background:var(--black); color:var(--white);
    display:flex; align-items:center; gap:6px; padding:8px 8px 8px 16px; box-shadow:0 6px 20px rgba(0,0,0,.25);
  }
  .rest .label{color:var(--g3);}
  .rest .t{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-style:italic; font-size:36px; color:var(--lime); line-height:1; flex:1; margin-left:6px;}
  .rest button{height:40px; min-width:44px; background:transparent; color:var(--white); border:1px solid var(--g3); font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:16px; cursor:pointer;}
  .rest.fin{background:var(--lime);}
  .rest.fin .t,.rest.fin .label{color:var(--black);}
  .rest.fin button{color:var(--black); border-color:var(--black);}

  /* ---------- Body ---------- */
  .wcard{background:var(--white); border:1px solid var(--g1); padding:20px;}
  .wtop{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .date-in{height:36px; border:1px solid var(--g2); background:var(--white); font-family:'JetBrains Mono',monospace; font-size:14px; padding:0 8px; border-radius:0;}
  .wrow{display:flex; align-items:baseline; gap:8px; margin-top:6px;}
  .wrow input{width:100%; max-width:200px; border:none; border-bottom:4px solid var(--black); background:transparent; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:72px; line-height:1; padding:0 4px; border-radius:0;}
  .wrow input:focus{outline:none; border-bottom-color:var(--lime);}
  .wrow .u{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:26px;}
  .wlatest{background:var(--black); color:var(--white); padding:18px 20px; margin-top:10px; display:flex; align-items:flex-end; justify-content:space-between;}
  .wlatest .label{color:var(--white);}
  .wlatest .v{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-style:italic; font-size:52px; line-height:.9; color:var(--lime);}
  .wlatest .v span{font-size:22px; color:var(--white);}
  .wlatest .d{font-family:'JetBrains Mono',monospace; font-size:13px; text-align:right;}
  .wlatest .d b{display:inline-block; background:var(--lime); color:var(--black); padding:1px 7px; margin-top:4px;}
  .wl-item{display:flex; align-items:center; gap:10px; padding:10px 8px 10px 16px; background:var(--white); border:1px solid var(--g1); border-left:6px solid var(--lime); margin-bottom:8px;}
  .wl-item .tl-d{flex:1;}

  /* ---------- Charts ---------- */
  .chart-box{background:var(--white); border:1px solid var(--g1); padding:16px 10px 6px;}
  .sel{width:100%; border:1px solid var(--black); background:var(--white); font-weight:700; font-size:16px; padding:0 12px; height:48px; margin-bottom:10px; border-radius:0;}
  .sel:focus{outline:none; box-shadow:inset 0 0 0 2px var(--lime);}
  .seg{display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--black); margin-bottom:10px;}
  .seg button{height:40px; background:var(--white); border:none; border-right:1px solid var(--black); font-weight:700; font-size:12px; cursor:pointer;}
  .seg button:last-child{border-right:none;}
  .seg button.on{background:var(--black); color:var(--lime);}
  .best{margin-top:10px; padding:12px 14px; background:var(--white); border:1px solid var(--g1); border-left:6px solid var(--black); font-family:'JetBrains Mono',monospace; font-size:12px;}
  .best b{font-family:'Barlow Condensed',sans-serif; font-size:24px; margin:0 4px;}
  svg.chart{display:block; width:100%; height:auto; overflow:visible;}

  /* ---------- Log ---------- */
  .tl-month{margin-bottom:26px;}
  .tl-month h3{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-style:italic; font-size:28px; text-transform:uppercase; display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px;}
  .tl-month h3 small{font-family:'JetBrains Mono',monospace; font-style:normal; font-weight:500; font-size:11px; letter-spacing:.1em;}
  .tl{border-left:2px solid var(--black); margin-left:5px;}
  .tl-item{position:relative; padding:14px 0 14px 20px; border-bottom:1px solid var(--g1); display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center;}
  .tl-item.tap{cursor:pointer;}
  .tl-item::before{content:''; position:absolute; left:-7px; top:20px; width:12px; height:12px; background:var(--white); border:2px solid var(--black); transform:skewX(-10deg);}
  .tl-item.full::before{background:var(--lime);}
  .tl-d{font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700;}
  .tl-t{font-weight:700; font-size:14px; margin-top:2px;}
  .tl-t span{font-weight:500; font-size:12px; margin-left:8px; color:var(--g3);}
  .tl-bar{height:4px; background:var(--g1); margin-top:8px; max-width:200px;}
  .tl-bar i{display:block; height:100%; background:var(--black);}
  .tl-item.full .tl-bar i{background:var(--lime);}
  .tl-w{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:22px; text-align:right; white-space:nowrap;}
  .tl-detail{grid-column:1 / -1; font-size:13px; line-height:1.9; background:var(--white); border:1px solid var(--g1); padding:10px 12px;}
  .tl-detail .exl{font-family:'JetBrains Mono',monospace; font-size:12px;}
  .tl-detail .exl b{font-family:'Noto Sans JP',sans-serif; font-size:13px; margin-right:6px;}
  .tl-detail .memo-v{margin-top:4px; white-space:pre-wrap; border-left:3px solid var(--lime); padding-left:8px;}
  .tl-detail .btn{margin-top:10px;}

  /* ---------- Setup ---------- */
  .srow{background:var(--white); border:1px solid var(--g1); padding:10px 12px; margin-bottom:8px; display:grid; gap:8px;}
  .srow.arch{opacity:.5;}
  .srow-top{display:grid; grid-template-columns:24px 1fr; gap:8px; align-items:center;}
  .rt-grid{display:grid; grid-template-columns:1fr 1fr 1fr 36px 36px 36px; gap:6px; align-items:end;}
  .ex-grid{display:grid; grid-template-columns:1fr 1fr auto auto; gap:6px;}
  .num{display:flex; flex-direction:column; gap:2px; min-width:0;}
  .num input{width:100%; min-width:0; height:38px; border:1px solid var(--g2); background:var(--bg); font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:20px; text-align:center; border-radius:0;}
  .ibtn{min-width:36px; height:38px; padding:0 8px; border:1px solid var(--g2); background:var(--white); font-weight:700; font-size:13px; cursor:pointer; white-space:nowrap;}
  .ibtn:disabled{opacity:.3; cursor:default;}
  .ibtn:not(:disabled):active{background:var(--lime);}
  .sm-sel,.txt{width:100%; min-width:0; height:40px; border:1px solid var(--g2); background:var(--white); font-size:16px; font-weight:700; padding:0 10px; border-radius:0;}
  .sm-sel:focus,.txt:focus,.num input:focus{outline:none; border-color:var(--black);}
  .addbox{background:var(--white); border:1px solid var(--black); padding:12px; display:grid; gap:8px; margin-top:12px;}
  .addbox .two{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
  .chk{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700;}
  .chk input{width:18px; height:18px; accent-color:#000000;}
  .setting{display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--white); border:1px solid var(--g1); padding:12px 14px; margin-bottom:8px; font-size:14px; font-weight:700;}
  .setting .sm-sel,.setting .txt{width:130px;}
  .btns{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:8px;}
  .btns .btn{padding:0; height:46px; font-size:15px; letter-spacing:.04em;}
  #backupArea{height:180px; font-family:'JetBrains Mono',monospace; font-size:12px; margin-top:4px;}
  .msg{margin-top:10px; min-height:20px; font-size:13px; font-weight:700;}
  .note{margin-top:16px; padding:14px; background:var(--white); border:1px solid var(--g1); border-left:6px solid var(--lime); font-size:12px; line-height:1.8;}

  .timer{background:var(--black); color:var(--white); margin-top:10px; padding:16px 16px 14px;}
  .timer .label{color:var(--white);}
  .timer .label.dim{color:var(--g3);}
  .timer-top{display:flex; justify-content:space-between; align-items:center;}
  .tbig{display:block; width:100%; background:none; border:none; cursor:pointer; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-style:italic; font-size:76px; line-height:1; color:var(--lime); text-align:center; margin:8px 0 4px; font-variant-numeric:tabular-nums;}
  .thint{text-align:center; margin-bottom:10px; letter-spacing:.08em;}
  .tedit{margin:10px 0 12px;}
  .tin{display:flex; align-items:flex-start; justify-content:center; gap:8px;}
  .tin label{display:flex; flex-direction:column; align-items:center; gap:4px;}
  .tin input{width:96px; height:72px; border:2px solid var(--lime); background:var(--black); color:var(--lime); font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:54px; text-align:center; border-radius:0;}
  .tin input:focus{outline:none; background:#ffffff; color:var(--black);}
  .tin b{font-family:'Barlow Condensed',sans-serif; font-size:54px; color:var(--lime); line-height:72px;}
  .tpre{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:10px;}
  .tpre button{height:36px; background:var(--black); color:var(--white); border:1px solid var(--g3); font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:16px; cursor:pointer;}
  .tpre button:active{background:var(--lime); color:var(--black);}
  .tok{display:grid; grid-template-columns:1fr 1.4fr; gap:8px; margin-top:8px;}
  .tok .btn{height:44px; padding:0; font-size:16px;}
  .tok .btn.line{background:var(--black); color:var(--white); border-color:var(--g3);}

<body>
<div class="app">

  <header class="appbar">
    <h1 id="viewTitle">Today</h1>
    <div class="bar-r">
      <select class="lang-top" id="langTop" aria-label="Language">

      </select>

  <!-- TODAY -->

        </div>
      </div>
      <div class="hero-bar"><i id="heroBar" style="width:0%"></i></div>
    </div>

    <div class="minis">
      <div class="mini"><div class="label dim">VOLUME</div><div class="n" id="mVol">0</div></div>
      <div class="mini"><div class="label dim">STREAK</div><div class="n"><span id="mStreak">0</span><small data-i18n="unit.day"> 日</small></div></div>
      <div class="mini"><div class="label dim">DAYS</div><div class="n"><span id="mDays">0</span><small data-i18n="unit.day"> 日</small></div></div>
    </div>

    <div class="timer" id="timerCard">
      <div class="timer-top"><span class="label">REST TIMER <span data-i18n="timer.sub"></span></span><span class="label dim" id="tState">READY</span></div>
      <button class="tbig" id="tBig" type="button">1:30</button>
      <div class="tedit" id="tEdit" hidden>
        <div class="tin">
          <label><input id="tMin" type="number" min="0" max="60" inputmode="numeric"><span class="label dim" data-i18n="timer.min"></span></label>
          <b>:</b>
          <label><input id="tSec" type="number" min="0" max="59" inputmode="numeric"><span class="label dim" data-i18n="timer.sec"></span></label>
        </div>
        <div class="tpre" id="tPre"><button data-s="30">0:30</button><button data-s="60">1:00</button><button data-s="90">1:30</button><button data-s="120">2:00</button><button data-s="180">3:00</button></div>
        <div class="tok"><button class="btn line" id="tCancel" data-i18n="timer.cancel"></button><button class="btn" id="tSet" data-i18n="timer.set"></button></div>
      </div>

      </div>
    </div>

    <div class="section-t">Menu <small id="menuCount">0 ITEMS</small></div>

    </div>
    <datalist id="adhocList"></datalist>
    <button class="btn line sm block" id="recallBtn" data-i18n="recall" style="margin-top:8px;"></button>

    <div class="section-t">Memo <small data-i18n="memo.sub"></small></div>
    <textarea id="memo" class="memo" data-i18n-ph="memo.ph" placeholder=""></textarea>
  </main>

  <!-- BODY -->
  <main class="view" id="v-body">
    <div class="wcard">
      <div class="wtop">
        <div class="label">BODY WEIGHT <span data-i18n="body.sub"></span></div>

      </div>
      <div class="wrow"><input id="bInput" type="number" step="0.1" inputmode="decimal" placeholder="0.0"><span class="u">kg</span></div>

    <div class="wlatest">

      </div>

      <button data-r="0" data-i18n="rAll">全期間</button>

    <div class="best" id="bStats" hidden></div>

      <div class="drow">
        <label class="num"><span class="label dim" data-i18n="daylog.start"></span><input type="time" id="dStart"></label>

    <div id="bList"></div>

      const l = lm.get(s.workout_log_id);

  const anims = new Map();
  const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function scramble(el, host, key, dur, done){
    if(reduceMotion() || typeof requestAnimationFrame !== 'function'){ el.textContent = key; done && done(); return; }
    cancelAnimationFrame(anims.get(el));
    host.classList.remove('lock'); host.classList.add('glitch');
    const start = performance.now(), n = key.length;
    let last = 0;
    const frame = now => {
      const k = (now - start) / dur;
      if(k >= 1){
        el.textContent = key;
        host.classList.remove('glitch'); host.style.removeProperty('--gx'); host.style.removeProperty('--gs');
        void host.offsetWidth; host.classList.add('lock');
        anims.delete(el); done && done();
        return;
      }
      if(now - last > 40){
        last = now;
        let out = '';
        for(let i = 0; i < n; i++){
          const ch = key[i];
          out += /\d/.test(ch) && !(k > 0.35 + 0.65*(i+1)/n) ? Math.floor(Math.random()*10) : ch;
        }
        el.textContent = out;
        host.style.setProperty('--gx', (Math.random()*6 - 3).toFixed(1) + 'px');
        host.style.setProperty('--gs', (Math.random()*6 - 3).toFixed(1) + 'deg');
      }
      anims.set(el, requestAnimationFrame(frame));
    };
    anims.set(el, requestAnimationFrame(frame));
  }

  /* ---------- CHARTS ---------- */
  let gid = 0;
  function drawChart(box, pts){
    if(!pts.length){ box.innerHTML = '<div class="empty">NO DATA</div>'; return; }
    const id = 'cg' + (++gid);
    const W = 460, H = 220, L = 46, R = 16, T = 16, B = 30;
    const ys = pts.map(p => p.y);
    let lo = Math.min(...ys), hi = Math.max(...ys);
    if(lo === hi){ lo -= 1; hi += 1; }
    const r = hi - lo; lo -= r*.12; hi += r*.12;
    const pw = W-L-R, ph = H-T-B;
    const step = pts.length > 1 ? pw/(pts.length-1) : 0;
    // p.t（時刻）があれば日付の間隔どおりに配置、なければ等間隔
    const t0 = pts[0].t, t1 = pts[pts.length-1].t, timed = t0 != null && t1 > t0;
    const X = i => timed ? L + (pts[i].t - t0)/(t1 - t0)*pw : pts.length > 1 ? L + step*i : L + pw/2;
    const Y = v => T + ph - (v-lo)/(hi-lo)*ph;
    const line = pts.map((p,i) => (i?'L':'M') + X(i).toFixed(1) + ',' + Y(p.y).toFixed(1)).join(' ');
    const area = `${line} L${X(pts.length-1).toFixed(1)},${T+ph} L${X(0).toFixed(1)},${T+ph} Z`;
    let grid = '';
    for(let g = 0; g <= 3; g++){ const y = T + ph/3*g; grid += `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#eeeeee"/>`; }
    const every = Math.max(1, Math.ceil(pts.length/5));
    let labels = '';
    const lab = (x, s) => `<text x="${x.toFixed(1)}" y="${H-8}" font-size="10" fill="#aaaaaa" font-family="JetBrains Mono, monospace" text-anchor="middle">${s}</text>`;
    if(timed){
      for(let k = 0; k <= 4; k++){ const d = new Date(t0 + (t1-t0)*k/4); labels += lab(L + pw*k/4, `${pad(d.getMonth()+1)}/${pad(d.getDate())}`); }
    } else pts.forEach((p,i) => { if(i % every === 0 || i === pts.length-1) labels += lab(X(i), p.x); });
    const rr = pts.length > 40 ? 3 : 5;
    const dots = pts.map((p,i) => `<circle cx="${X(i)}" cy="${Y(p.y)}" r="${rr}" fill="#ceff00" stroke="#000000" stroke-width="2"/>`).join('');
    box.innerHTML = `
      <svg class="chart" viewBox="0 0 ${W} ${H}">
        <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ceff00" stop-opacity=".85"/><stop offset="1" stop-color="#ceff00" stop-opacity="0"/>
        </linearGradient></defs>
        ${grid}
        <text x="${L-8}" y="${T+4}" font-size="10" fill="#aaaaaa" font-family="JetBrains Mono, monospace" text-anchor="end">${hi.toFixed(1)}</text>
        <text x="${L-8}" y="${T+ph+4}" font-size="10" fill="#aaaaaa" font-family="JetBrains Mono, monospace" text-anchor="end">${lo.toFixed(1)}</text>
        <path d="${area}" fill="url(#${id})"/>
        <path d="${line}" fill="none" stroke="#000000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
        ${dots}${labels}
      </svg>`;
  }
  function weightPts(days){
    const m = bwMap();
    let keys = Object.keys(m).sort();
    if(days > 0){
      const c = new Date(todayKey() + 'T12:00:00'); c.setDate(c.getDate() - days + 1);
      const ck = fmt(c); keys = keys.filter(k => k >= ck);
    }
    return keys.map(k => ({x:sd(k), y:m[k], t:new Date(k + 'T12:00:00').getTime(), k}));
  }

      $('bStats').innerHTML = `${t('stat.min')}<b>${Math.min(...ys).toFixed(1)}</b>kg　${t('stat.max')}<b>${Math.max(...ys).toFixed(1)}</b>kg　${t('stat.chg')}<b>${sign}${Math.abs(diff).toFixed(1)}</b>kg`;

  function renderLog(){
    const box = $('tl'); box.innerHTML = '';

    db.workout_logs.forEach(l => { const k = dayKey(l.executed_at); (by[k] = by[k] || []).push(l); });
    Object.keys(bw).forEach(k => { by[k] = by[k] || []; });
    const days = Object.keys(by).sort().reverse().slice(0,180);
    if(!days.length){ box.append(h('div', {class:'empty', style:'line-height:2; letter-spacing:.06em;'}, 'NO DATA', h('br'), t('log.empty'))); return; }
    const months = {};
    days.forEach(d => (months[d.slice(0,7)] = months[d.slice(0,7)] || []).push(d));
    Object.keys(months).sort().reverse().forEach(m => {
      const [y, mo] = m.split('-');
      const tl = h('div', {class:'tl'});
      months[m].forEach(d => tl.append(logItem(d, by[d], bw[d])));

  function logItem(d, logs, w){
    const sets = logs.flatMap(l => setsOf(l.id)), work = sets.filter(isWork);
    const rate = logs.length ? logRate(logs[0]) : null;
    const pct = rate == null ? null : Math.round(rate*100);
    const exIds = [...new Set(sets.map(s => s.exercise_id))];
    const pr = logs.some(l => exIds.some(id => isPR(l, id)));
    const tags = [];
    if(d === todayKey()) tags.push(['#TODAY','']);
    if(!work.length) tags.push(['#REST','plain']);
    else if(pct == null) tags.push(['#FREE','']);
    else if(pct >= 100) tags.push(['#PERFECT','']);
    else if(pct >= 70) tags.push(['#GOOD','']);
    else tags.push(['#PARTIAL','plain']);
    if(pr) tags.push(['#PR','pr']);
    if(w != null) tags.push(['#WEIGHT','plain']);
    const memos = logs.filter(l => l.memo && l.memo.trim());
    const times = logs.filter(l => l.start_time || l.duration_min).map(l => '⏱ ' + [l.start_time ? l.start_time + '〜' : '', l.duration_min ? t('daylog.min', {n:l.duration_min}) : ''].filter(Boolean).join(' '));
    const detail = h('div', {class:'tl-detail', hidden:true},
      exIds.map(id => h('div', {class:'exl'}, h('b', null, exName(id)), logs.flatMap(l => setsFor(l.id, id)).map(fmtSet).join(' · '))),
      times.map(x => h('div', {class:'exl'}, x)),
      memos.map(l => h('div', {class:'memo-v'}, l.memo)),
      logs.length > 0 && h('button', {class:'btn sm line', onclick:ev => { ev.stopPropagation(); delDay(logs); }}, t('log.delBtn')));
    const it = h('div', {class:'tl-item' + (pct >= 100 ? ' full' : '')},
      h('div', null,
        h('div', {class:'tl-d'}, `${d.slice(5,7)}.${d.slice(8)} ${WD[new Date(d + 'T12:00:00').getDay()]}`),
        h('div', {class:'tl-t'}, work.length ? (pct == null ? t('log.free') : t('log.rate', {p:pct})) : t('log.rest'),
          work.length > 0 && h('span', null, t('log.sets', {n:work.length}) + (volOf(sets) > 0 ? ` · ${kg(volOf(sets))}kg` : ''))),
        pct != null && h('div', {class:'tl-bar'}, h('i', {style:`width:${pct}%`})),
        h('div', {class:'tags'}, tags.map(([t,c]) => h('span', {class:'tg ' + c}, t)))),
      h('div', {class:'tl-w', html: w != null ? `${w.toFixed(1)}<span style="font-size:12px"> kg</span>` : '—'}),
      detail);
    if(sets.length || memos.length || times.length){ it.classList.add('tap'); it.onclick = () => { detail.hidden = !detail.hidden; }; }
    return it;
  }

    fillSel($('nxMuscle'), MUSCLES, t('muscle'));
    fillSel($('nxEquip'), EQUIP, t('equip'));
    const sd0 = $('setDay').value; $('setDay').innerHTML = '';
    for(let i = 0; i <= 6; i++) $('setDay').append(h('option', {value:String(i)}, t('dayOpt', {i})));
    $('setDay').value = sd0 || String(db.settings.day_start_hour);
    $('setLang').value = LANG; $('langTop').value = LANG;
    renderBar();
    ({today:renderToday, body:renderBody, log:renderLog, setup:renderSetup})[current]();
    renderTimer();
  }
  const setLangFrom = sel => {
    LANG = sel.value; db.settings.lang = LANG; save();
    applyLang();
  };
  $('setLang').onchange = () => setLangFrom($('setLang'));
  $('langTop').onchange = () => setLangFrom($('langTop'));

  /* ---------- init ---------- */
  load();
  if(!LANGS.includes(db.settings.lang)){ db.settings.lang = LANG; save(); }
  lastDay = todayKey();
  applyLang();
  // アプリ化（PWA）: https で公開したときだけオフライン用の service worker を登録
  if('serviceWorker' in navigator && location.protocol === 'https:'){
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
  $('optSound').checked = !!db.settings.sound;
  $('optWake').checked = !!db.settings.keep_awake;
  renderTimer(); applyWake();
  setInterval(checkDay, 30000);
  document.addEventListener('visibilitychange', () => { if(!document.hidden){ checkDay(); if(restTimer) tick(); applyWake(); } });
})();
</script>
</body>
</html>
